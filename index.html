<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voyager AI</title>
    <meta name="description" content="Your intelligent travel companion powered by Gemini 2.5 Flash. Plan trips, resolve conflicting travel ideas and trade-offs, find flights and hotels, and get real-time advice." />
    <meta property="og:title" content="Voyager AI" />
    <meta property="og:description" content="Your intelligent travel companion powered by Gemini 2.5 Flash. Plan trips, resolve conflicting travel ideas and trade-offs, find flights and hotels, and get real-time advice." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0f172a', // slate-900
              accent: '#3b82f6', // blue-500
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideIn: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            },
            animation: {
              fadeIn: 'fadeIn 0.2s ease-out',
              slideIn: 'slideIn 0.3s ease-out',
            }
          },
        },
      }
    </script>
    <script>
      // 1. Critical Polyfill for process.env (Gemini SDK needs this)
      window.process = window.process || {};
      window.process.env = window.process.env || {};
      
      // 2. Global Error Handler for startup failures
      window.addEventListener('error', function(event) {
        const loader = document.getElementById('initial-loader');
        if (loader) {
           loader.innerHTML = `
             <div style="text-align: center; color: #ef4444; padding: 20px;">
               <h3 style="font-weight: bold; font-size: 1.25rem; margin-bottom: 0.5rem;">Startup Error</h3>
               <p style="font-size: 0.875rem;">${event.message}</p>
               <button onclick="window.location.reload()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: #3b82f6; color: white; border: none; border-radius: 0.5rem; cursor: pointer;">Retry</button>
             </div>
           `;
           // Stop spinner
           const spinner = loader.querySelector('.spinner');
           if(spinner) spinner.style.display = 'none';
        }
      });
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      /* Loading Spinner Styles */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <!-- 3. Correct Import Map - Strictly React 18 -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1?bundle",
    "remark-gfm": "https://esm.sh/remark-gfm@4.0.0?bundle",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0",
    "@google/genai": "https://esm.sh/@google/genai@0.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
</head>
  <body class="bg-slate-50 text-slate-900 h-screen overflow-hidden">
    <!-- Initial Loader -->
    <div id="initial-loader">
      <div class="spinner"></div>
      <p style="margin-top: 1rem; color: #64748b; font-size: 0.875rem; font-weight: 500;">Initializing Voyager AI...</p>
    </div>

    <div id="root" class="h-full"></div>
    
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
